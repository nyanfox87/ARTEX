# ARTEX 騰訊 TSec Benchmark 測評映像 —— 本地一鍵 build + run。
# 與生產用的 docker-compose.yml(多服務:artex+postgres)互不影響。
# 用法：
#   cp bench/.env.example bench/.env   # 填 LLM_API_KEY / BENCHMARK_TOKEN 等
#   docker compose -f docker-compose.bench.yml up --build      # 構建並前臺執行(看日誌)
#   docker compose -f docker-compose.bench.yml up --build -d   # 後臺
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # 停止(加 -v 連資料卷一起刪)
# 瀏覽器：http://localhost:8787（用 ADMIN_PASSWORD 登入）

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # 與物理機共享網路：容器直接用宿主網路棧，可直連宿主/VPN 上的靶機網路。
    # host 模式下不用 ports 對映，容器直接綁宿主埠：8787(UI/API)、8788(代理)、
    # 以及內部 PostgreSQL 5432 —— 請確保宿主這三個埠空閒（本地測前先停掉佔用它們的服務）。
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
